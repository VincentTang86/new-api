<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fair Router — User Guide</title>
    <meta
      name="description"
      content="How to sign up, create an API key, add credit and call models through the Fair Router API gateway."
    />
    <link rel="icon" type="image/svg+xml" href="/fairrouter-icon.svg" />
    <link rel="icon" href="/fairrouter-favicon.ico" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --bg-soft: #f8fafc;
        --fg: #0f172a;
        --fg-muted: #52607a;
        --border: #e2e8f0;
        --accent: #4f46e5;
        --accent-soft: #eef2ff;
        --code-bg: #0f172a;
        --code-fg: #e2e8f0;
        --note-bg: #f5f6ff;
      }

      :root[data-theme='dark'] {
        --bg: #0b1120;
        --bg-soft: #111a2e;
        --fg: #e7ecf5;
        --fg-muted: #9aa8c0;
        --border: #22304d;
        --accent: #a5b4fc;
        --accent-soft: #1b2547;
        --code-bg: #060b16;
        --code-fg: #dbe3f3;
        --note-bg: #16203a;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
          'Noto Sans SC', 'Noto Sans JP', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.875em;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.1em 0.35em;
        overflow-wrap: anywhere;
      }

      header.topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(8px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
        letter-spacing: -0.01em;
        color: var(--fg);
      }

      .brand:hover {
        text-decoration: none;
      }

      .brand img {
        height: 26px;
        width: auto;
      }

      .brand-sub {
        color: var(--fg-muted);
        font-weight: 450;
      }

      .topbar-spacer {
        flex: 1;
      }

      select#lang {
        appearance: none;
        background: var(--bg-soft);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 30px 6px 10px;
        font: inherit;
        font-size: 0.875rem;
        cursor: pointer;
        background-image:
          linear-gradient(45deg, transparent 50%, currentColor 50%),
          linear-gradient(135deg, currentColor 50%, transparent 50%);
        background-position:
          calc(100% - 15px) 55%,
          calc(100% - 10px) 55%;
        background-size:
          5px 5px,
          5px 5px;
        background-repeat: no-repeat;
      }

      .topbar-link {
        font-size: 0.875rem;
        white-space: nowrap;
      }

      .layout {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 48px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 96px;
      }

      nav.toc {
        position: sticky;
        top: 76px;
        align-self: start;
        max-height: calc(100vh - 110px);
        overflow-y: auto;
        font-size: 0.875rem;
      }

      nav.toc p {
        margin: 0 0 10px;
        font-size: 0.72rem;
        font-weight: 650;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--fg-muted);
      }

      nav.toc ol {
        list-style: none;
        margin: 0;
        padding: 0;
        counter-reset: toc;
      }

      nav.toc a {
        display: block;
        padding: 5px 10px;
        border-radius: 6px;
        color: var(--fg-muted);
        counter-increment: toc;
      }

      nav.toc a::before {
        content: counter(toc) '. ';
        opacity: 0.6;
      }

      nav.toc a:hover {
        background: var(--bg-soft);
        color: var(--fg);
        text-decoration: none;
      }

      nav.toc a.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }

      main {
        min-width: 0;
      }

      .page-head {
        border-bottom: 1px solid var(--border);
        padding-bottom: 28px;
        margin-bottom: 8px;
      }

      .eyebrow {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 650;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 10px 0 12px;
        font-size: clamp(1.9rem, 4vw, 2.5rem);
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .tagline {
        margin: 0;
        color: var(--fg-muted);
        font-size: 1.05rem;
      }

      section {
        padding-top: 44px;
      }

      section > h2 {
        margin: 0 0 14px;
        font-size: 1.45rem;
        letter-spacing: -0.015em;
        scroll-margin-top: 80px;
      }

      section h3 {
        margin: 28px 0 10px;
        font-size: 1.05rem;
      }

      section p {
        margin: 0 0 14px;
      }

      section ul,
      section ol {
        margin: 0 0 14px;
        padding-left: 22px;
      }

      section li {
        margin-bottom: 7px;
      }

      .note {
        margin: 18px 0;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        background: var(--note-bg);
        color: var(--fg-muted);
        font-size: 0.94rem;
      }

      .note strong {
        color: var(--fg);
      }

      .table-wrap {
        overflow-x: auto;
        margin: 0 0 18px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.94rem;
      }

      th,
      td {
        text-align: left;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      th {
        background: var(--bg-soft);
        font-weight: 600;
        white-space: nowrap;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .code {
        position: relative;
        margin: 0 0 18px;
        border-radius: 10px;
        background: var(--code-bg);
        overflow: hidden;
      }

      .code pre {
        margin: 0;
        padding: 16px 18px;
        overflow-x: auto;
        color: var(--code-fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.84rem;
        line-height: 1.65;
      }

      .code button {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 4px 10px;
        border: 1px solid rgba(226, 232, 240, 0.25);
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.6);
        color: #cbd5e1;
        font: inherit;
        font-size: 0.75rem;
        cursor: pointer;
      }

      .code button:hover {
        color: #fff;
        border-color: rgba(226, 232, 240, 0.5);
      }

      footer.page-footer {
        border-top: 1px solid var(--border);
        margin-top: 56px;
        padding-top: 22px;
        color: var(--fg-muted);
        font-size: 0.875rem;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 0;
          padding: 28px 20px 72px;
        }

        nav.toc {
          position: static;
          max-height: none;
          margin-bottom: 24px;
          padding-bottom: 20px;
          border-bottom: 1px solid var(--border);
        }

        .brand-sub {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <!-- Decorative: the brand name sits next to it as real text, so an alt
             would just make screen readers say "FairRouter" twice. -->
        <img src="/fairrouter-mark.png" alt="" />
        <span>FairRouter</span>
        <span class="brand-sub" id="brand-sub">User Guide</span>
      </a>
      <span class="topbar-spacer"></span>
      <a class="topbar-link" id="link-console" href="/dashboard">Console</a>
      <select id="lang" aria-label="Language"></select>
    </header>

    <div class="layout">
      <nav class="toc" aria-label="Contents">
        <p id="toc-label">Contents</p>
        <ol id="toc"></ol>
      </nav>
      <main>
        <div class="page-head">
          <span class="eyebrow" id="eyebrow">Fair Router</span>
          <h1 id="title"></h1>
          <p class="tagline" id="tagline"></p>
        </div>
        <div id="sections"></div>
        <footer class="page-footer">
          <a href="/">fairrouter.ai</a>
          <a href="/pricing" id="link-pricing">Models &amp; Pricing</a>
          <a href="/about" id="link-about">About</a>
          <a href="/privacy-policy" id="link-privacy">Privacy Policy</a>
          <a href="/user-agreement" id="link-terms">Terms of Service</a>
        </footer>
      </main>
    </div>

    <script>
      /* ------------------------------------------------------------------
       * Language-neutral snippets. Shared by every translation so the code a
       * reader copies is identical regardless of the language they read in.
       * ---------------------------------------------------------------- */
      var SAMPLES = {
        curl:
          'curl https://fairrouter.ai/v1/chat/completions \\\n' +
          '  -H "Content-Type: application/json" \\\n' +
          '  -H "Authorization: Bearer $FAIRROUTER_API_KEY" \\\n' +
          "  -d '{\n" +
          '    "model": "deepseek-v4-flash",\n' +
          '    "messages": [\n' +
          '      {"role": "user", "content": "Hello"}\n' +
          '    ]\n' +
          "  }'",
        python:
          'from openai import OpenAI\n\n' +
          'client = OpenAI(\n' +
          '    base_url="https://fairrouter.ai/v1",\n' +
          '    api_key="sk-your-key",\n' +
          ')\n\n' +
          'response = client.chat.completions.create(\n' +
          '    model="deepseek-v4-flash",\n' +
          '    messages=[{"role": "user", "content": "Hello"}],\n' +
          ')\n\n' +
          'print(response.choices[0].message.content)',
        node:
          'import OpenAI from "openai"\n\n' +
          'const client = new OpenAI({\n' +
          '  baseURL: "https://fairrouter.ai/v1",\n' +
          '  apiKey: process.env.FAIRROUTER_API_KEY,\n' +
          '})\n\n' +
          'const response = await client.chat.completions.create({\n' +
          '  model: "deepseek-v4-flash",\n' +
          '  messages: [{ role: "user", content: "Hello" }],\n' +
          '})\n\n' +
          'console.log(response.choices[0].message.content)',
        stream:
          'stream = client.chat.completions.create(\n' +
          '    model="deepseek-v4-flash",\n' +
          '    messages=[{"role": "user", "content": "Hello"}],\n' +
          '    stream=True,\n' +
          ')\n\n' +
          'for chunk in stream:\n' +
          '    delta = chunk.choices[0].delta.content\n' +
          '    if delta:\n' +
          '        print(delta, end="")',
        models:
          'curl https://fairrouter.ai/v1/models \\\n' +
          '  -H "Authorization: Bearer $FAIRROUTER_API_KEY"',
      }

      var LANGS = [
        { code: 'en', label: 'English', html: 'en' },
        { code: 'zhCN', label: '简体中文', html: 'zh-CN' },
        { code: 'zhTW', label: '繁體中文', html: 'zh-TW' },
        { code: 'fr', label: 'Français', html: 'fr' },
        { code: 'ru', label: 'Русский', html: 'ru' },
        { code: 'ja', label: '日本語', html: 'ja' },
        { code: 'vi', label: 'Tiếng Việt', html: 'vi' },

      /* ------------------------------------------------------------------
       * Rendering
       * ---------------------------------------------------------------- */
      var STORAGE_KEY = 'fr-guide-lang'

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
      }

      /* Inline markup used inside the content strings:
       *   [[…]]        -> <code>
       *   **…**        -> <strong>
       *   [text](href) -> <a>
       */
      function inline(value) {
        return escapeHtml(value)
          .replace(/\[\[([^\]]+)\]\]/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
      }

      function renderBlock(block, strings) {
        var kind = block[0]
        var value = block[1]

        if (kind === 'p') return '<p>' + inline(value) + '</p>'
        if (kind === 'h3') return '<h3>' + inline(value) + '</h3>'
        if (kind === 'note')
          return '<div class="note">' + inline(value) + '</div>'
        if (kind === 'ul' || kind === 'steps') {
          var tag = kind === 'ul' ? 'ul' : 'ol'
          var items = value
            .map(function (item) {
              return '<li>' + inline(item) + '</li>'
            })
            .join('')
          return '<' + tag + '>' + items + '</' + tag + '>'
        }
        if (kind === 'table') {
          var head = value[0]
            .map(function (cell) {
              return '<th>' + inline(cell) + '</th>'
            })
            .join('')
          var body = value
            .slice(1)
            .map(function (row) {
              return (
                '<tr>' +
                row
                  .map(function (cell) {
                    return '<td>' + inline(cell) + '</td>'
                  })
                  .join('') +
                '</tr>'
              )
            })
            .join('')
          return (
            '<div class="table-wrap"><table><thead><tr>' +
            head +
            '</tr></thead><tbody>' +
            body +
            '</tbody></table></div>'
          )
        }
        if (kind === 'code') {
          var snippet = SAMPLES[value] || ''
          return (
            '<div class="code"><button type="button" data-copy>' +
            escapeHtml(strings.copy) +
            '</button><pre>' +
            escapeHtml(snippet) +
            '</pre></div>'
          )
        }
        return ''
      }

      function render(code) {
        var data = CONTENT[code] || CONTENT.en
        var meta = LANGS.filter(function (item) {
          return item.code === code
        })[0]

        document.documentElement.lang = meta ? meta.html : 'en'
        document.title = 'Fair Router — ' + data.title
        document.getElementById('title').textContent = data.title
        document.getElementById('tagline').textContent = data.tagline
        document.getElementById('toc-label').textContent = data.toc
        document.getElementById('brand-sub').textContent = data.sub
        document.getElementById('link-console').textContent = data.nav.console
        document.getElementById('link-pricing').textContent = data.nav.pricing
        document.getElementById('link-about').textContent = data.nav.about
        document.getElementById('link-privacy').textContent = data.nav.privacy
        document.getElementById('link-terms').textContent = data.nav.terms

        document.getElementById('toc').innerHTML = data.sections
          .map(function (section) {
            return (
              '<li><a href="#' +
              section.id +
              '">' +
              escapeHtml(section.t) +
              '</a></li>'
            )
          })
          .join('')

        document.getElementById('sections').innerHTML = data.sections
          .map(function (section) {
            return (
              '<section id="' +
              section.id +
              '"><h2>' +
              escapeHtml(section.t) +
              '</h2>' +
              section.b
                .map(function (block) {
                  return renderBlock(block, data)
                })
                .join('') +
              '</section>'
            )
          })
          .join('')

        bindCopyButtons(data)
        markActiveTocEntry()
      }

      function bindCopyButtons(strings) {
        var buttons = document.querySelectorAll('[data-copy]')
        Array.prototype.forEach.call(buttons, function (button) {
          button.addEventListener('click', function () {
            var snippet = button.parentNode.querySelector('pre').textContent
            navigator.clipboard.writeText(snippet).then(function () {
              button.textContent = strings.copied
              setTimeout(function () {
                button.textContent = strings.copy
              }, 1500)
            })
          })
        })
      }

      function markActiveTocEntry() {
        var links = document.querySelectorAll('nav.toc a')
        var sections = document.querySelectorAll('main section')
        if (!sections.length) return

        var current = sections[0].id
        Array.prototype.forEach.call(sections, function (section) {
          if (section.getBoundingClientRect().top <= 120) current = section.id
        })

        Array.prototype.forEach.call(links, function (link) {
          link.classList.toggle(
            'active',
            link.getAttribute('href') === '#' + current
          )
        })
      }

      /* Match the console: theme lives in the `vite-ui-theme` cookie the app
       * writes, and the reader's saved guide language falls back to the
       * language i18next stored for the console. */
      function readCookie(name) {
        var match = document.cookie.match(
          new RegExp('(?:^|; )' + name + '=([^;]*)')
        )
        return match ? decodeURIComponent(match[1]) : null
      }

      function applyTheme() {
        var stored = readCookie('vite-ui-theme') || 'system'
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute(
          'data-theme',
          dark ? 'dark' : 'light'
        )
      }

      function initialLanguage() {
        var codes = LANGS.map(function (item) {
          return item.code
        })
        var saved = null
        try {
          saved =
            localStorage.getItem(STORAGE_KEY) ||
            localStorage.getItem('i18nextLng')
        } catch (error) {
          saved = null
        }
        if (saved && codes.indexOf(saved) !== -1) return saved

        var browser = (navigator.language || 'en').toLowerCase()
        if (browser.indexOf('zh') === 0) {
          return browser.indexOf('tw') !== -1 ||
            browser.indexOf('hk') !== -1 ||
            browser.indexOf('hant') !== -1
            ? 'zhTW'
            : 'zhCN'
        }
        var base = browser.split('-')[0]
        return codes.indexOf(base) !== -1 ? base : 'en'
      }

      var select = document.getElementById('lang')
      select.innerHTML = LANGS.map(function (item) {
        return '<option value="' + item.code + '">' + item.label + '</option>'
      }).join('')

      var active = initialLanguage()
      select.value = active
      select.addEventListener('change', function () {
        active = select.value
        try {
          localStorage.setItem(STORAGE_KEY, active)
        } catch (error) {
          /* private browsing — the choice simply does not persist */
        }
        render(active)
      })

      applyTheme()
      window
        .matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', applyTheme)
      render(active)
      window.addEventListener('scroll', markActiveTocEntry, { passive: true })
    </script>
  </body>
</html>
